<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>포도야 이용권 발급</title>
<style>
  :root{
    --ink:#1a1420;      /* 포도 껍질 속 어두운 자주 */
    --grape:#6D28D9;
    --grape-lo:#A78BFA;
    --leaf:#3FA96A;
    --paper:#FBF9FD;
    --line:#E6DEF3;
    --warn:#B4442B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--paper); color:var(--ink);
    padding:22px 16px 60px; max-width:520px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }

  /* 머리 — 포도 한 송이가 곧 신분증 */
  header{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  header svg{flex:0 0 auto}
  h1{font-size:20px; font-weight:800; letter-spacing:-.4px}
  .sub{font-size:12.5px; color:#6b5f7a; margin:4px 0 24px; line-height:1.6}

  section{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:18px 16px; margin-bottom:14px;
  }
  h2{
    font-size:12px; font-weight:800; letter-spacing:.6px; color:var(--grape);
    margin-bottom:14px; display:flex; align-items:center; gap:7px;
  }
  h2::after{content:''; flex:1; height:1px; background:var(--line)}

  label{display:block; font-size:12.5px; font-weight:700; margin:0 0 6px}
  .hint{font-size:11px; color:#8a7f96; font-weight:400; margin-top:5px; line-height:1.6}
  input,select{
    width:100%; padding:12px 13px; font-size:15px; font-family:inherit;
    border:1.5px solid var(--line); border-radius:11px; background:#fff; color:var(--ink);
    outline:none;
  }
  input:focus,select:focus{border-color:var(--grape-lo); box-shadow:0 0 0 3px rgba(167,139,250,.18)}
  .field{margin-bottom:15px}
  .field:last-of-type{margin-bottom:18px}

  button{
    width:100%; padding:14px; font-size:15px; font-weight:800; font-family:inherit;
    border:none; border-radius:12px; cursor:pointer; color:#fff;
    background:var(--grape); transition:opacity .15s;
  }
  button:active{opacity:.82}
  button:disabled{opacity:.5; cursor:default}
  button.ghost{background:#fff; color:var(--grape); border:1.5px solid var(--line)}

  .row{display:flex; gap:9px; align-items:center}
  .row input{flex:1}
  .row button{width:auto; padding:12px 16px; flex:0 0 auto}

  .chk{display:flex; align-items:center; gap:8px; font-size:12.5px; color:#6b5f7a; margin-top:12px}
  .chk input{width:17px; height:17px; flex:0 0 auto}

  /* 결과 — 이 페이지가 존재하는 이유 */
  .out{margin-top:16px; display:none}
  .out.on{display:block}
  .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:23px; font-weight:700; letter-spacing:1.5px; text-align:center;
    padding:20px 12px; border-radius:13px; color:#fff;
    background:linear-gradient(135deg,var(--grape),#4C1D95);
    word-break:break-all; line-height:1.4;
  }
  .meta{
    font-size:12.5px; color:#6b5f7a; line-height:2; margin-top:12px;
    border-top:1px solid var(--line); padding-top:12px;
  }
  .meta b{color:var(--ink); font-weight:700}
  .err{
    background:#FDF2EF; border:1px solid #F3D5CC; color:var(--warn);
    border-radius:11px; padding:13px 14px; font-size:13px; line-height:1.65;
  }
  .note{
    font-size:11.5px; color:#8a7f96; line-height:1.75;
    background:#F7F3FC; border-radius:11px; padding:13px 14px; margin-top:2px;
  }
  .note b{color:var(--grape)}
</style>
</head>
<body>

<header>
  <svg width="42" height="42" viewBox="0 0 512 512" aria-hidden="true">
    <rect width="512" height="512" rx="118" fill="#fff" stroke="#E6DEF3" stroke-width="8"/>
    <path d="M256 152c-20-22-46-28-46-50 0-16 14-24 26-18 8 4 16 12 20 20 4-8 12-16 20-20 12-6 26 2 26 18 0 22-26 28-46 50z" fill="#3FA96A"/>
    <circle cx="196" cy="308" r="74" fill="#7C4DEA" stroke="#5B21B6" stroke-width="15"/>
    <circle cx="320" cy="316" r="90" fill="#A78BFA" stroke="#5B21B6" stroke-width="15"/>
  </svg>
  <div>
    <h1>이용권 발급</h1>
  </div>
</header>
<p class="sub">코드를 만들고, 남은 양을 확인합니다. 주인만 쓰는 화면이에요.</p>

<section>
  <h2>설정</h2>

  <div class="field">
    <label for="url">워커 주소</label>
    <input id="url" type="url" spellcheck="false" autocomplete="off"
           value="https://podoya-api.hasin7jk.workers.dev">
  </div>

  <div class="field">
    <label for="tok">관리자 토큰</label>
    <input id="tok" type="password" placeholder="Cloudflare에 넣은 ADMIN_TOKEN"
           autocomplete="off" spellcheck="false">
    <div class="hint">Anthropic 키가 아니라, 직접 정하신 문자열이에요.</div>
    <div class="chk">
      <input id="save" type="checkbox">
      <label for="save" style="margin:0;font-weight:400">이 폰에 기억해 두기</label>
    </div>
  </div>

  <div class="note">
    토큰은 이 폰에만 저장돼요. 남의 기기에서는 기억해 두기를 켜지 마세요.
  </div>
</section>

<section>
  <h2>새 코드 만들기</h2>

  <div class="field">
    <label for="plan">이용권 종류</label>
    <select id="plan">
      <option value="basic">베이직 — 대화 150 · 검색 30 · 받아쓰기 300</option>
      <option value="pro">프로 — 대화 300 · 검색 100 · 받아쓰기 1000</option>
    </select>
  </div>

  <div class="field">
    <label for="memo">메모</label>
    <input id="memo" type="text" placeholder="누구에게 주는 코드인지" autocomplete="off">
    <div class="hint">나중에 누구 것인지 찾을 때 씁니다.</div>
  </div>

  <button id="issue">코드 만들기</button>

  <div class="out" id="issueOut"></div>
</section>

<section>
  <h2>남은 양 보기</h2>

  <div class="field">
    <label for="chk">이용권 코드</label>
    <div class="row">
      <input id="chk" type="text" placeholder="PODO-XXXX-XXXX"
             autocomplete="off" spellcheck="false" style="text-transform:uppercase">
      <button class="ghost" id="check">확인</button>
    </div>
  </div>

  <div class="out" id="checkOut"></div>
</section>

<script>
var $ = function(id){ return document.getElementById(id); };
var K_URL = 'podo_admin_url', K_TOK = 'podo_admin_tok';

/* 저장해 둔 값 불러오기 */
try{
  var u = localStorage.getItem(K_URL); if(u) $('url').value = u;
  var t = localStorage.getItem(K_TOK); if(t){ $('tok').value = t; $('save').checked = true; }
}catch(e){}

function base(){ return $('url').value.trim().replace(/\/+$/,''); }

function remember(){
  try{
    localStorage.setItem(K_URL, base());
    if($('save').checked) localStorage.setItem(K_TOK, $('tok').value.trim());
    else localStorage.removeItem(K_TOK);
  }catch(e){}
}

function show(box, html){ box.innerHTML = html; box.classList.add('on'); }
function fail(box, msg){ show(box, '<div class="err">' + msg + '</div>'); }

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

/* ── 코드 만들기 ─────────────────────────── */
$('issue').onclick = function(){
  var out = $('issueOut'), btn = this;
  var tok = $('tok').value.trim();

  if(!tok){ fail(out, '관리자 토큰을 넣어 주세요.'); return; }
  remember();

  btn.disabled = true; btn.textContent = '만드는 중…';

  fetch(base() + '/api/admin/issue', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'X-Admin-Token': tok },
    body: JSON.stringify({ plan: $('plan').value, memo: $('memo').value.trim() })
  })
  .then(function(r){ return r.json().then(function(d){ return { s:r.status, d:d }; }); })
  .then(function(res){
    var d = res.d;
    if(res.s === 403){ fail(out, '토큰이 맞지 않아요. Cloudflare에 저장한 <b>ADMIN_TOKEN</b> 과 글자 하나까지 같아야 합니다.'); return; }
    if(!d || !d.ok){ fail(out, esc((d && d.error) || '만들지 못했어요.')); return; }

    show(out,
      '<div class="code">' + esc(d.code) + '</div>' +
      '<div class="meta">' +
        '<b>' + esc(d.plan) + '</b> · ' + esc(d.expires) + ' 까지<br>' +
        '대화 ' + d.quota.chat + ' · 검색 ' + d.quota.search + ' · 받아쓰기 ' + d.quota.stt +
      '</div>' +
      '<button class="ghost" style="margin-top:12px" onclick="copyCode(\'' + esc(d.code) + '\',this)">코드 복사</button>'
    );
    $('chk').value = d.code;
  })
  .catch(function(){ fail(out, '워커에 닿지 못했어요. 주소를 확인해 주세요.'); })
  .then(function(){ btn.disabled = false; btn.textContent = '코드 만들기'; });
};

function copyCode(code, btn){
  var done = function(){ btn.textContent = '복사했어요'; setTimeout(function(){ btn.textContent = '코드 복사'; }, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done)['catch'](function(){ prompt('코드', code); });
  } else { prompt('코드', code); }
}

/* ── 남은 양 보기 ────────────────────────── */
$('check').onclick = function(){
  var out = $('checkOut'), btn = this;
  var code = $('chk').value.trim().toUpperCase();

  if(!code){ fail(out, '코드를 넣어 주세요.'); return; }
  remember();

  btn.disabled = true; btn.textContent = '…';

  fetch(base() + '/api/status?code=' + encodeURIComponent(code))
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d || !d.ok){ fail(out, esc((d && d.msg) || '찾지 못했어요.')); return; }

    var t = d.todayUsed || {}, c = d.dailyCap || {};
    show(out,
      '<div class="meta" style="border-top:none;padding-top:0">' +
        '<b>' + esc(d.plan) + '</b>' + (d.expired ? ' · <span style="color:var(--warn)">만료됨</span>' : ' · ' + esc(d.expires) + ' 까지') + '<br>' +
        '남은 양 — 대화 <b>' + d.left.chat + '</b> · 검색 <b>' + d.left.search + '</b> · 받아쓰기 <b>' + d.left.stt + '</b><br>' +
        '오늘 쓴 양 — 대화 ' + (t.chat||0) + '/' + (c.chat||0) + ' · 검색 ' + (t.search||0) + '/' + (c.search||0) + ' · 받아쓰기 ' + (t.stt||0) + '/' + (c.stt||0) +
      '</div>'
    );
  })
  .catch(function(){ fail(out, '워커에 닿지 못했어요.'); })
  .then(function(){ btn.disabled = false; btn.textContent = '확인'; });
};

/* 코드 칸에서 엔터 */
$('chk').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('check').click(); });
</script>

</body>
</html>
